name: Qualidade

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: qualidade-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualidade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: yarn

      - run: yarn install --frozen-lockfile

      - run: yarn lint
      - run: yarn format:check
      - run: yarn knip
      - run: yarn secretlint
      - run: yarn build

      # Regras de .claude/rules/seo.md no HTML gerado (verificar-seo.mjs)
      - run: yarn seo

      # Lighthouse no perfil celular: notas mínimas e Core Web Vitals (lighthouserc.json)
      - uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: ./lighthouserc.json
          uploadArtifacts: true
